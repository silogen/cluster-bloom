name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go tests
        run: go test ./...

      # Runs in the container the suite is built for: fixtures that write to
      # /etc/rancher/rke2 refuse to run outside one.
      - name: Ansible unit tests
        run: bash tests/ansible/run_tests_docker.sh

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            just \
            mkisofs \
            ovmf \
            qemu-system-x86-64 \
            qemu-utils \
            qemu-kvm

      - name: Build
        run: just build

      - name: Test
        run: |
          sudo bash tests/qemu/manual-qemu-test.sh  --timeout 120 qemu-vm tests/qemu/profile_2_nvme.yaml dist/bloom tests/qemu/bloom.yaml

      - name: Logs
        run: |
          sudo bash qemu-vm/ssh-vm.sh tail -n 20 bloom.log
