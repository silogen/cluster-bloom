name: Release Cluster-Bloom

# Creating a release in the GitHub UI publishes it before this binary exists.
# Immutable releases then reject the upload. Run this workflow instead: it
# builds bloom, uploads the asset, and publishes in one gh release create call.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v2.5.1'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: false
        type: boolean
        default: true

jobs:
  buildAndRelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.12.0

      - name: Build with devbox
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z._+-]+$ ]]; then
            echo "Tag must look like v2.5.1"
            exit 1
          fi
          devbox run build -ldflags="-X 'github.com/silogen/cluster-bloom/cmd.Version=${RELEASE_TAG}'"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z._+-]+$ ]]; then
            echo "Tag must look like v2.5.1"
            exit 1
          fi

          args=(
            --title "ClusterBloom Release ${RELEASE_TAG}"
            --target "${GITHUB_SHA}"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          # gh creates a draft, uploads the asset, then publishes.
          gh release create "$RELEASE_TAG" dist/bloom "${args[@]}"
