apiVersion: batch/v1
kind: CronJob
metadata:
  name: label-and-annotate-nodes
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: node-label-annotator
              image: ghcr.io/silogen/kubectl:latest
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "10m"
                limits:
                  memory: "128Mi"
              command:
                - /bin/sh
                - -c
                - |
                  for node in $(kubectl get nodes -o name); do
                    gpu_node=$(kubectl get $node -o jsonpath='{.metadata.labels.cluster-bloom/gpu-node}')
                    if [ "$gpu_node" = "true" ]; then
                      echo "Labeling $node as GPU node"
                      kubectl label $node feature.node.kubernetes.io/amd-gpu=true
                      kubectl label $node amd.com/gpu.product-name=AMD_Instinct_MI300X_OAM
                    fi
                    longhorn_annotation=$(kubectl get $node -o jsonpath='{.metadata.annotations.node\.longhorn\.io/default-disks-config}')
                    if [ -z "$longhorn_annotation" ]; then
                      disk_data=$(kubectl get $node -o json | jq -r '.metadata.labels | to_entries[] | select(.key | startswith("bloom.disk")) | "\(.key)=\(.value)"' 2>/dev/null)
                      if [ -n "$disk_data" ]; then
                        echo "Processing Longhorn disk labels for $node"
                        disks_json="["
                        first=true
                        for entry in $disk_data; do
                          label_key=$(echo "$entry" | cut -d= -f1)
                          label_value=$(echo "$entry" | cut -d= -f2-)
                          if [ "$label_value" = "block" ]; then
                            device_path=$(echo "$label_key" | sed 's/^bloom\.disk//' | sed 's/___/\//g')
                            disk_name=$(basename "$device_path" | tr '/' '-')
                            json="{\"path\":\"${device_path}\",\"allowScheduling\":true,\"name\":\"${disk_name}\",\"diskType\":\"block\",\"diskDriver\":\"auto\"}"
                          elif echo "$label_value" | grep -q '^premounted'; then
                            mount_point=$(echo "$label_key" | sed 's/^bloom\.disk//' | sed 's/___/\//g')
                            disk_name=$(basename "$mount_point" | tr '/' '-')
                            json="{\"path\":\"${mount_point}\",\"allowScheduling\":true,\"name\":\"${disk_name}\"}"
                          else
                            mount_point=$(echo "$label_key" | sed 's/^bloom\.disk//' | sed 's/___/\//g')
                            disk_name=$(echo "$label_value" | sed 's/___/_/g')
                            json="{\"path\":\"${mount_point}\",\"allowScheduling\":true,\"name\":\"${disk_name}\"}"
                          fi
                          if [ "$first" = true ]; then
                            first=false
                          else
                            disks_json="${disks_json},"
                          fi
                          disks_json="${disks_json}${json}"
                        done
                        disks_json="${disks_json}]"
                        echo "Annotating $node with Longhorn disk config: $disks_json"
                        kubectl annotate $node node.longhorn.io/default-disks-config="$disks_json"
                      fi
                    fi
                  done
          restartPolicy: OnFailure
          serviceAccountName: node-annotator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-annotator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-annotator-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-annotator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-annotator-role
subjects:
  - kind: ServiceAccount
    name: node-annotator
    namespace: default
