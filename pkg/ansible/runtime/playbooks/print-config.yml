---
- name: Print Bloom Configuration Values
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Print configuration header
      debug:
        msg: "=== Bloom Configuration Values ==="

    - name: Print Basic Configuration
      debug:
        msg: |
          📋 Basic Configuration:
            FIRST_NODE: {{ FIRST_NODE | default('NOT SET') }}
            GPU_NODE: {{ GPU_NODE | default('NOT SET') }}
            DOMAIN: {{ DOMAIN | default('NOT SET') }}
            CLUSTER_SIZE: {{ CLUSTER_SIZE | default('NOT SET') }}
            SERVER_IP: {{ SERVER_IP | default('NOT SET') }}

    - name: Print Cluster Size Optimizations
      debug:
        msg: |
          📏 Cluster Size Impact ({{ CLUSTER_SIZE | default('NOT SET') }}):
          {% if CLUSTER_SIZE == 'small' %}
            🔧 Cilium Operator Replicas: 1 (HelmChartConfig at bootstrap)
            💾 Storage Provisioner: local-path-provisioner (high-performance local storage)
            🎯 Target Scale: Up to 3 nodes, development/testing workloads
            📝 Resource Profile: Minimal overhead, reduced HA for cost efficiency
            📊 Hubble Observability: Disabled (saves resources)
          {% elif CLUSTER_SIZE == 'medium' %}
            🔧 Cilium Operator Replicas: 1 (HelmChartConfig at bootstrap)
            💾 Storage Provisioner: local-path-provisioner (high-performance local storage)
            🎯 Target Scale: 1-3 nodes, development/testing workloads
            📝 Resource Profile: Minimal overhead, reduced HA for cost efficiency
            📊 Hubble Observability: Disabled (saves resources)
          {% elif CLUSTER_SIZE == 'large' %}
            🔧 Cilium Operator Replicas: 2 (RKE2 chart default)
            💾 Storage Provisioner: Longhorn (distributed storage with replication)
            🎯 Target Scale: 10+ nodes, enterprise workloads
            📝 Resource Profile: High availability and performance
            📊 Hubble Observability: Disabled (security and performance)
          {% else %}
            🔧 Cilium Operator Replicas: 2 (default; use small/medium for 1 at bootstrap)
            💾 Storage Provisioner: Longhorn (default distributed storage)
            📝 Note: Set CLUSTER_SIZE (small/medium/large) to optimize deployment
          {% endif %}

    - name: Print Storage Configuration
      debug:
        msg: |
          💾 Storage Configuration:
            CLUSTER_DISKS: {{ CLUSTER_DISKS | default('NOT SET') }}
            CLUSTER_PREMOUNTED_DISKS: {{ CLUSTER_PREMOUNTED_DISKS | default('NOT SET') }}
            NO_DISKS_FOR_CLUSTER: {{ NO_DISKS_FOR_CLUSTER | default('NOT SET') }}

    - name: Print SSL/TLS Configuration
      debug:
        msg: |
          🔒 SSL/TLS Configuration:
            USE_CERT_MANAGER: {{ USE_CERT_MANAGER | default('NOT SET') }}
            CERT_OPTION: {{ CERT_OPTION | default('NOT SET') }}
            TLS_CERT: {{ TLS_CERT | default('NOT SET') }}
            TLS_KEY: {{ TLS_KEY | default('NOT SET') }}
            ADDITIONAL_TLS_SAN_URLS: {{ ADDITIONAL_TLS_SAN_URLS | default('NOT SET') }}
            LETSENCRYPT_EMAIL: {{ LETSENCRYPT_EMAIL | default('NOT SET') }}

    - name: Print GPU Configuration
      debug:
        msg: |
          🎮 GPU Configuration:
            GPU_STACK_FAMILY: {{ gpu_stack_family_resolved | default(GPU_STACK_FAMILY) | default('instinct') }}
            GPU_DRIVER_SKIP_INSTALL: {{ GPU_DRIVER_SKIP_INSTALL | default(false) }}
            GPU_INSTALL_HOST_TOOLS: {{ GPU_INSTALL_HOST_TOOLS | default(true) }}
            amdgpu driver package (no ROCm): {{ GPU_DRIVER_VERSION | default(gpu_driver_default_version) | default('NOT SET') }}.{{ GPU_DRIVER_BUILD | default(gpu_driver_default_build) | default('NOT SET') }}
            GPU Operator: {{ gpu_operator_path | default('NOT SET') }}
            GPU Operator config: {{ gpu_operator_config_path | default('NOT SET') }}
            DeviceConfig ROCm driver: {{ gpu_deviceconfig_driver_version | default('NOT SET') }}
          {% if gpu_stack_tech_preview | default(false) | bool %}
            ⚠️  TECH PREVIEW: the {{ gpu_stack_family_resolved | default('radeon') }} Enterprise AI stack
                (GPU Operator) for this release is a tech preview, not production qualified.
          {% endif %}
            Driver policy synopsis:
              Supported existing driver table:
                ROCm 7.0.2 -> driver 30.10.2 -> DKMS 6.14.14.30100200-2226257
                ROCm 7.1.1 -> driver 30.20.1 -> DKMS 6.16.6.30200100-2255209
                ROCm 7.2.3 -> driver 30.30.3 -> DKMS 6.16.13.30300300-2327507
                ROCm 7.13.0 -> driver 31.30.0 -> DKMS 6.19.4.31300000-2337710
                ROCm 7.14.0 -> driver 31.40.0 -> DKMS 6.19.14.31400000-2364437
              - Any exact tuple above: retain and continue.
              - Existing unrecognized amdgpu DKMS driver: halt with remediation instructions.
              - Existing host ROCm without an identifiable supported DKMS driver:
                halt rather than replace its inbox/unknown driver.
              - Fresh/inbox-only host: install 31.40.314000-1 -> driver 31.40.0
                -> DKMS 6.19.14; host ROCm is not installed or required.
              - Missing amd-smi with host tools enabled: install the standalone
                package matching the effective driver, with minimal dependencies.

    - name: Print RKE2 Configuration
      debug:
        msg: |
          ⚙️ RKE2 Configuration:
            RKE2_INSTALLATION_URL: {{ RKE2_INSTALLATION_URL | default('NOT SET') }}
            RKE2_VERSION: {{ RKE2_VERSION | default('NOT SET') }}

    - name: Print Advanced Configuration
      debug:
        msg: |
          🔧 Advanced Configuration:
            ENABLE_CLUSTERFORGE: {{ ENABLE_CLUSTERFORGE | default('NOT SET') }}
            CLUSTERFORGE_AIRGAP_ARCHIVE: {{ CLUSTERFORGE_AIRGAP_ARCHIVE | default('NOT SET') }}
            ENABLE_CLUSTERFORGE_OIDC: {{ ENABLE_CLUSTERFORGE_OIDC | default('NOT SET') }}
            OIDC_ISSUER_URL: {{ OIDC_ISSUER_URL | default('NOT SET') }}
            OIDC_CLIENT_ID: {{ OIDC_CLIENT_ID | default('NOT SET') }}
            OIDC_CLIENT_SECRET: {{ OIDC_CLIENT_SECRET | default('NOT SET') }}
            ADDITIONAL_OIDC_PROVIDERS: {{ ADDITIONAL_OIDC_PROVIDERS | default('NOT SET') }}

    - name: Print Command Line Options
      debug:
        msg: |
          💻 Command Line Options:
            USE_SUDO: {{ USE_SUDO | default('NOT SET') }}
            DEBUG_MODE: {{ DEBUG_MODE | default('NOT SET') }}
            SKIP_PREFLIGHT_CHECKS: {{ SKIP_PREFLIGHT_CHECKS | default('NOT SET') }}
            FORCE_REINSTALL: {{ FORCE_REINSTALL | default('NOT SET') }}

    - name: Print all variables (raw)
      debug:
        msg: "All ansible vars: {{ vars | dict2items | selectattr('key', 'match', '^[A-Z_]+$') | list }}"

    - name: Configuration check complete
      debug:
        msg: "=== Configuration Print Complete ==="
