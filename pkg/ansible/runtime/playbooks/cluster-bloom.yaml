---
- name: Cluster Bloom - RKE2 Kubernetes Cluster Setup
  hosts: all
  become: yes
  gather_facts: false
  gather_subset:
    - min
    - network
  vars:
    # * * * * * * * * * * * * * 
    ### CLUSTERFORGE_RELEASE - SET THIS VALUE IN pkg/config/bloom.yaml.schema.yaml
    # * * * * * * * * * * * * *
    FIRST_NODE: true
    GPU_NODE: true
    CONTROL_PLANE: false
    DOMAIN: ""
    CLUSTER_SIZE: medium
    SERVER_IP: ""
    JOIN_TOKEN: ""
    NO_DISKS_FOR_CLUSTER: false
    CLUSTER_DISKS: ""
    CLUSTER_PREMOUNTED_DISKS: ""
    USE_CERT_MANAGER: false
    CERT_OPTION: ""
    TLS_CERT: ""
    TLS_KEY: ""
    ADDITIONAL_OIDC_PROVIDERS: []
    ADDITIONAL_TLS_SAN_URLS: []
    RKE2_VERSION: ""
    RKE2_EXTRA_CONFIG: ""
    
    # DNS Configuration (opt-in for safety)
    # FIX_DNS: Set to true to allow automatic DNS fixes if DNS is broken
    #          Only modifies /etc/resolv.conf if DNS tests fail AND external DNS works
    #          Creates backups before modification with automatic rollback on failure
    #          WARNING: Will overwrite /etc/resolv.conf if DNS is detected as broken
    FIX_DNS: false

    # PAUSE_K3S: Legacy force flag; k3s conflicts are paused automatically by default.
    # Set SKIP_K3S_PAUSE: true to fail instead of auto-pausing on loaned nodes.
    PAUSE_K3S: false
    SKIP_K3S_PAUSE: false
    
    # DNS_SERVERS: Custom DNS servers for RKE2 cluster
    #              If set, these nameservers will be written to /etc/rancher/rke2/resolv.conf
    #              instead of copying host DNS. Format as YAML list (e.g., ["8.8.8.8", "1.1.1.1"])
    DNS_SERVERS: []
    
    CLUSTERFORGE_REPO: "https://github.com/silogen/cluster-forge.git"
    BLOOM_DIR: "/tmp/bloom"
    # EAI-5657: exact driver compatibility policy. These play-level defaults
    # also support direct ansible-playbook use when Bloom's Go layer is bypassed.
    GPU_INSTALL_HOST_TOOLS: true
    gpu_driver_default_version: "31.40"
    gpu_driver_default_build: "314000-1"
    gpu_driver_supported:
      - DriverRelease: "30.10.2"
        InstallerVersion: "7.0.2"
        InstallerBuild: "70002-1"
        DKMSModuleVersion: "6.14.14"
        DKMSBuild: "2226257"
        DKMSPackageCode: "30100200"
        PairedROCm: "7.0.2"
        HostToolsChannel: legacy
        HostToolsPackage: amd-smi-lib
      - DriverRelease: "30.20.1"
        InstallerVersion: "7.1.1"
        InstallerBuild: "70101-1"
        DKMSModuleVersion: "6.16.6"
        DKMSBuild: "2255209"
        DKMSPackageCode: "30200100"
        PairedROCm: "7.1.1"
        HostToolsChannel: legacy
        HostToolsPackage: amd-smi-lib
      - DriverRelease: "30.30.3"
        InstallerVersion: "7.2.3"
        InstallerBuild: "70203-1"
        DKMSModuleVersion: "6.16.13"
        DKMSBuild: "2327507"
        DKMSPackageCode: "30300300"
        PairedROCm: "7.2.3"
        HostToolsChannel: legacy
        HostToolsPackage: amd-smi-lib
      - DriverRelease: "30.30.4"
        InstallerVersion: "7.2.4"
        InstallerBuild: "70204-1"
        DKMSModuleVersion: "6.16.13"
        DKMSBuild: "2341068"
        DKMSPackageCode: "30300400"
        PairedROCm: "7.2.4"
        HostToolsChannel: legacy
        HostToolsPackage: amd-smi-lib
      - DriverRelease: "31.30.0"
        InstallerVersion: "31.30"
        InstallerBuild: "313000-1"
        DKMSModuleVersion: "6.19.4"
        DKMSBuild: "2337710"
        DKMSPackageCode: "31300000"
        PairedROCm: "7.13.0"
        HostToolsChannel: core
        HostToolsPackage: amdrocm-amdsmi7.13
      - DriverRelease: "31.40.0"
        InstallerVersion: "31.40"
        InstallerBuild: "314000-1"
        DKMSModuleVersion: "6.19.14"
        DKMSBuild: "2364437"
        DKMSPackageCode: "31400000"
        PairedROCm: "7.14.0"
        HostToolsChannel: core-multiarch
        HostToolsPackage: amdrocm-amdsmi7.14
    gpu_stack_family_resolved: instinct
    rke2_installation_url: "https://get.rke2.io"

    supported_ubuntu_versions:
      - "20.04"
      - "22.04"
      - "24.04"

    rke2_ports_tcp:
      - "80"
      - "443"
      - "2376"
      - "2379"
      - "2380"
      - "6443"
      - "9099"
      - "9345"
      - "10250"
      - "10254"
      - "30000:32767"

    rke2_ports_udp:
      - "8472"
      - "30000:32767"

    inotify_target_value: 512
    rancher_min_partition_gb: 500
    bloom_fstab_tag: "# managed by cluster-bloom"
    bloom_premounted_fstab_tag: "# premounted by cluster-bloom"
    bloom_rancher_fstab_tag: "# managed by cluster-bloom rancher-disk"
    bloom_fstab_section_header: "# # # this section is managed by AMD Enterprise AI tool cluster-bloom"
    bloom_fstab_section_footer: "# # # end of AMD Enterprise AI cluster-bloom"

  pre_tasks:
    - name: Check passwordless sudo is configured
      ansible.builtin.command:
        cmd: /bin/true
      become: true
      changed_when: false
      register: sudo_check
      ignore_errors: true

    - name: Fail if passwordless sudo is not configured
      fail:
        msg: |
          ❌ Passwordless sudo is required but not configured for the current user.

          Fix: run the following command on the target host and then retry:

            echo "$USER ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/cluster-bloom-nopasswd
      when: sudo_check.failed | default(false)

    - name: Gather facts
      ansible.builtin.setup:
        gather_subset:
          - min
          - network

  tasks:
    - name: Pre-deployment Data Safety Validation
      tags: [pre_deployment]
      include_tasks: tasks/data_safety_check.yaml
      vars:
        validate_no_disks_for_cluster: "{{ NO_DISKS_FOR_CLUSTER | default(false) }}"
        validate_cluster_disks: "{{ CLUSTER_DISKS | default('') }}"
        validate_config_file: "{{ bloom_config_file | default('bloom.yaml') }}"

    - name: Pause conflicting k3s installation (loaned nodes)
      tags: [pre_deployment, k3s_pause]
      include_tasks: tasks/k3s_pause.yaml
      when: (k3s_pause_required | default(false) | bool) or (PAUSE_K3S | default(false) | bool)

    - name: Node Validation
      tags: [validate_node]
      import_tasks: tasks/validate_node/main.yaml

    - name: Node Preparation
      tags: [prepare_node]
      import_tasks: tasks/prepare_node/main.yaml

    - name: Deploy Cluster Tasks
      tags: [deploy_cluster]
      import_tasks: tasks/deploy_cluster/main.yaml

    - name: Deploy Kubernetes Applications
      tags: [deploy_k8s_apps]
      import_tasks: tasks/deploy_k8s_apps/main.yaml

    - name: Deploy ClusterForge Platform
      tags: [deploy_clusterforge]
      import_tasks: tasks/deploy_clusterforge/main.yaml

    - name: Update Cluster Certificates
      tags: [update_cert]
      import_tasks: tasks/update_certificate/main.yaml

  handlers:
    - name: Restart multipathd
      service:
        name: multipathd
        state: restarted

    - name: Create iptables directory
      ansible.builtin.file:
        path: /etc/iptables
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Save iptables
      shell: iptables-save > /etc/iptables/rules.v4
      ignore_errors: yes

    - name: Set permissions on iptables rules file
      ansible.builtin.file:
        path: /etc/iptables/rules.v4
        owner: root
        group: root
        mode: '0644'

    - name: Reload udev
      shell: |
        udevadm control --reload-rules
        udevadm trigger

    - name: Restart chronyd
      service:
        name: chronyd
        state: restarted

    - name: Restart rsyslog
      service:
        name: rsyslog
        state: restarted