---
# Purpose: Main ClusterForge platform setup and bootstrap
# Dependencies: CLUSTERFORGE_RELEASE, CLUSTERFORGE_REPO, BLOOM_DIR, DOMAIN, CLUSTER_SIZE variables
# Usage: Imported by deploy_clusterforge/main.yaml
# Tags: [clusterforge, deploy_clusterforge]

- name: Create BLOOM_DIR base directory
  file:
    path: "{{ BLOOM_DIR }}"
    state: directory
    mode: "0755"
    owner: "{{ bloom_effective_user }}"

- name: Create ClusterForge directory in BLOOM_DIR
  file:
    path: "{{ BLOOM_DIR }}/clusterforge"
    state: directory
    mode: "0755"
    owner: "{{ bloom_effective_user }}"

- name: Check if CLUSTERFORGE_RELEASE is a URL
  set_fact:
    is_release_url: "{{ CLUSTERFORGE_RELEASE.startswith('http') }}"

- name: Validate CLUSTERFORGE_REPO is set for version mode
  fail:
    msg: "CLUSTERFORGE_REPO must be set when CLUSTERFORGE_RELEASE is a version string (not a URL)"
  when: not (is_release_url | bool) and (CLUSTERFORGE_REPO == "" or CLUSTERFORGE_REPO is not defined)

- name: Download ClusterForge release
  get_url:
    url: "{{ CLUSTERFORGE_RELEASE }}"
    dest: "{{ BLOOM_DIR }}/clusterforge/clusterforge.tar.gz"
    mode: "0644"
    timeout: 60
  register: clusterforge_release_download
  until: clusterforge_release_download is succeeded
  retries: 5
  delay: 10
  when: is_release_url | bool

- name: Extract ClusterForge release
  unarchive:
    src: "{{ BLOOM_DIR }}/clusterforge/clusterforge.tar.gz"
    dest: "{{ BLOOM_DIR }}/clusterforge"
    remote_src: yes
    extra_opts: [--no-same-owner]
  when: is_release_url | bool

- name: Clone ClusterForge repository (version/branch mode)
  shell: |
    rm -rf {{ BLOOM_DIR }}/clusterforge/cluster-forge
    git clone --branch {{ clusterforge_version }} --depth 1 {{ CLUSTERFORGE_REPO }} {{ BLOOM_DIR }}/clusterforge/cluster-forge
  when: not (is_release_url | bool)

# CLUSTER_SIZE is the infrastructure tier. CLUSTERFORGE_VALUES names the
# configuration in ClusterForge, root/values_<name>.yaml, and defaults to the
# tier. The file comes with the ClusterForge release, so bloom can check it
# only here, after the download.
- name: Resolve the ClusterForge values file
  set_fact:
    cf_values_name: "{{ CLUSTERFORGE_VALUES | default('', true) or (CLUSTER_SIZE | default('medium')) }}"

- name: Set the ClusterForge values file path
  set_fact:
    cf_values_file: "{{ BLOOM_DIR }}/clusterforge/cluster-forge/root/values_{{ cf_values_name }}.yaml"

- name: Debug ClusterForge bootstrap variables
  debug:
    msg:
      - "DOMAIN: {{ DOMAIN }}"
      - "CLUSTER_SIZE: {{ CLUSTER_SIZE | default('medium') }}"
      - "CLUSTERFORGE_VALUES: {{ cf_values_name }}"
      - "BLOOM_DIR: {{ BLOOM_DIR }}"
      - "clusterforge_version: {{ clusterforge_version }}"

- name: Check that the ClusterForge values file exists
  ansible.builtin.stat:
    path: "{{ cf_values_file }}"
  register: size_values_stat

- name: Find the values files of this ClusterForge release
  ansible.builtin.find:
    paths: "{{ BLOOM_DIR }}/clusterforge/cluster-forge/root"
    patterns: "values_*.yaml"
  register: cf_values_files
  when: not size_values_stat.stat.exists

- name: Fail when the ClusterForge values file does not exist
  fail:
    msg: |
      ClusterForge {{ clusterforge_version }} has no root/values_{{ cf_values_name }}.yaml.
      Set CLUSTERFORGE_VALUES (or CLUSTER_SIZE) to one of:
      {{ cf_values_files.files | map(attribute='path') | map('basename') | map('regex_replace', '^values_', '') | map('regex_replace', '[.]yaml$', '') | sort | join(', ') }}
  when: not size_values_stat.stat.exists

- name: Create namespaces
  ansible.builtin.shell: kubectl create namespace {{ item }} --dry-run=client -o yaml | kubectl apply -f -
  loop: "{{ ['argocd', 'cf-openbao'] if (CLUSTER_SIZE | default('medium')) == 'small' else ['argocd', 'cf-gitea', 'cf-openbao'] }}"
  changed_when: true

- name: Bootstrap ArgoCD
  ansible.builtin.include_tasks: bootstrap_argocd.yaml

- name: Bootstrap OpenBao
  ansible.builtin.include_tasks: bootstrap_openbao.yaml

- name: Bootstrap Gitea
  ansible.builtin.include_tasks: bootstrap_gitea.yaml
  when: (CLUSTER_SIZE | default('medium')) != 'small'

- name: Create ClusterForge parent application
  ansible.builtin.include_tasks: create_cluster_forge_app.yaml