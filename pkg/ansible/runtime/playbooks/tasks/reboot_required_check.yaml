---
# Purpose: detect an OS-level "reboot required" condition (e.g. after a
# kernel/DKMS amdgpu driver install) and hand off to bloom's CLI so it can
# offer to reboot the node, rather than letting a subsequent check hang or
# fail confusingly against a not-yet-active driver.
# Usage: include_tasks'd right after the driver-only install step
#        (prepare_node/gpu_driver_only.yaml).
# Tags: [gpu]
#
# Ported from EAI-7530 (full ROCm install branch); detection logic is
# unchanged — the underlying OS signal (a kernel/DKMS package needing a
# reboot) applies identically here even though this branch installs only the
# amdgpu driver, not ROCm.
#
# Detection uses both the OS's standard /var/run/reboot-required signal and
# gpu_driver_reboot_required from gpu_driver_only.yaml. The latter compares the
# active amdgpu module's srcversion with the mapped DKMS module on disk; this is
# required because DKMS does not consistently create /var/run/reboot-required
# when replacing an already-loaded inbox amdgpu module.
#
# State is tracked in /var/lib/bloom/reboot-required.json (host-level, not
# BLOOM_DIR-relative, so it persists regardless of which directory the user
# invokes bloom from next). Its "attempted" flag is a loop-guard: once bloom has
# rebooted once for a given unresolved condition, this task fails hard with a
# manual-intervention message instead of writing a fresh marker and letting
# bloom's CLI offer to reboot forever.

- name: Ensure /var/lib/bloom exists for reboot-required state tracking
  file:
    path: /var/lib/bloom
    state: directory
    mode: "0755"

- name: Check whether a reboot is required (kernel/driver package updates)
  stat:
    path: /var/run/reboot-required
  register: bloom_reboot_required_stat
  changed_when: false

- name: Resolve effective reboot requirement
  set_fact:
    bloom_reboot_required: >-
      {{
        bloom_reboot_required_stat.stat.exists or
        (gpu_driver_reboot_required | default(false) | bool)
      }}

- name: Check for the packages that triggered the reboot-required flag
  stat:
    path: /var/run/reboot-required.pkgs
  register: bloom_reboot_pkgs_stat
  changed_when: false
  when: bloom_reboot_required | bool

# Read the list on the target instead of with lookup('file'). The playbook's
# controller runs in its own mount namespace, where the host filesystem is under
# /host, so a controller-side lookup of a host path fails with "File not found"
# even though the stat above found the file on the target.
- name: Read the packages that triggered the reboot-required flag
  slurp:
    src: /var/run/reboot-required.pkgs
  register: bloom_reboot_pkgs_raw
  when:
    - bloom_reboot_required | bool
    - bloom_reboot_pkgs_stat.stat.exists | default(false)

- name: Check for a prior bloom reboot-required marker (loop guard)
  stat:
    path: /var/lib/bloom/reboot-required.json
  register: bloom_reboot_marker_stat
  changed_when: false

- name: Load prior reboot-required marker, if present
  slurp:
    src: /var/lib/bloom/reboot-required.json
  register: bloom_reboot_marker_raw
  when: bloom_reboot_marker_stat.stat.exists

- name: Parse prior reboot-required marker
  set_fact:
    bloom_reboot_marker: "{{ (bloom_reboot_marker_raw.content | b64decode | from_json) if bloom_reboot_marker_stat.stat.exists else {} }}"

- name: Clear a stale reboot-required marker (system no longer reports one)
  file:
    path: /var/lib/bloom/reboot-required.json
    state: absent
  when:
    - not (bloom_reboot_required | bool)
    - bloom_reboot_marker_stat.stat.exists

- name: Fail if bloom already rebooted for this and the system still requires one
  fail:
    msg: |
      ❌ A reboot was already performed to apply a pending kernel/GPU driver
      package update, but /var/run/reboot-required is STILL present after
      rebooting.

      This means the reboot did not resolve the pending update, or a new one
      appeared. Automatic recovery has been disabled here to avoid an infinite
      reboot loop.

      Please investigate manually on the node:
        cat /var/run/reboot-required.pkgs
        dmesg | grep -iE 'kfd|amdgpu'
        dkms status

      Once resolved, remove the marker and re-run bloom:
        sudo rm -f /var/lib/bloom/reboot-required.json
  when:
    - bloom_reboot_required | bool
    - bloom_reboot_marker.attempted | default(false) | bool

- name: Build reboot-required marker content
  set_fact:
    bloom_reboot_marker_new:
      reason: >-
        The active amdgpu module does not match the mapped DKMS driver on disk,
        or the OS reports a pending kernel/package update. A reboot is required
        before the GPU is usable with the mapped driver.
      packages: >-
        {{
          (((bloom_reboot_pkgs_raw.content | b64decode).split('\n') | select('truthy') | list)
          if bloom_reboot_pkgs_raw.content is defined
          else ['amdgpu-dkms'])
        }}
      attempted: false
      detected_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      run_id: "{{ bloom_run_id | default('') }}"
  when:
    - bloom_reboot_required | bool
    - not (bloom_reboot_marker.attempted | default(false) | bool)

- name: Write reboot-required marker for bloom's CLI to act on
  copy:
    dest: /var/lib/bloom/reboot-required.json
    mode: "0644"
    content: "{{ bloom_reboot_marker_new | to_nice_json }}"
  when:
    - bloom_reboot_required | bool
    - not (bloom_reboot_marker.attempted | default(false) | bool)

- name: Prompt for reboot (kernel / amdgpu driver package update)
  debug:
    msg: >-
      Reboot required before the mapped amdgpu DKMS driver is active. Bloom
      will offer to reboot on exit; pass --yes to auto-confirm, or just re-run
      bloom after rebooting (steps are idempotent).
  when:
    - bloom_reboot_required | bool
    - not (bloom_reboot_marker.attempted | default(false) | bool)

# Stop successfully as soon as the marker is written. The top-level bloom
# process sees exit code 0 plus the current run_id marker and offers to reboot.
# Continuing into the rest of node preparation / cluster deployment would run
# GPU-dependent work against the old inbox module and unnecessarily lengthen
# the install/reboot cycle.
- name: End play until the mapped amdgpu driver is active
  meta: end_play
  when:
    - bloom_reboot_required | bool
    - not (bloom_reboot_marker.attempted | default(false) | bool)
