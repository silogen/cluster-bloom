---
# Purpose: Configure GPU kernel module loading for AMD GPUs
# Dependencies: GPU_NODE variable
# Usage: Imported by prepare_node/main.yaml (conditional on GPU_NODE)
# Tags: [gpu, prep_node]

- name: Check amdgpu is not blacklisted
  shell: "! grep -RHqE --include='*.conf' '^[[:space:]]*blacklist[[:space:]]+amdgpu([[:space:]]|$)' /etc/modprobe.d 2>/dev/null"
  changed_when: false

- name: Load amdgpu kernel module
  modprobe:
    name: amdgpu
    state: present