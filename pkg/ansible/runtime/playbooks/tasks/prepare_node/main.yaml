---
# Purpose: Orchestrates all node preparation tasks in proper sequence
# Dependencies: Various - GPU_NODE, NO_DISKS_FOR_CLUSTER, CLUSTER_PREMOUNTED_DISKS, FIX_DNS
# Usage: Imported by main cluster-bloom.yaml playbook
# Tags: [prep_node]

- name: Install Dependent Packages
  include_tasks: packages.yaml
  tags: [packages, prep_node]

- name: Setup Multipath
  include_tasks: multipath.yaml
  tags: [storage, prep_node]

# EAI-5657: retain an allowlisted amdgpu DKMS driver or install the production
# driver on a fresh node. Host ROCm is neither required nor installed.
- name: Reconcile supported GPU driver (no ROCm install)
  include_tasks: gpu_driver_only.yaml
  when: (GPU_NODE | default(false) | bool) and not (GPU_DRIVER_SKIP_INSTALL | default(false) | bool)
  tags: [gpu, prep_node]

- name: Check for pending reboot after GPU driver install
  include_tasks: ../reboot_required_check.yaml
  when: (GPU_NODE | default(false) | bool) and not (GPU_DRIVER_SKIP_INSTALL | default(false) | bool)
  tags: [gpu, prep_node]

- name: Ensure standalone AMD-SMI host diagnostics
  include_tasks: gpu_host_tools.yaml
  when:
    - GPU_NODE | default(false) | bool
    - not (GPU_DRIVER_SKIP_INSTALL | default(false) | bool)
    - GPU_INSTALL_HOST_TOOLS | default(true) | bool
  tags: [gpu, prep_node]

- name: Update Modprobe (GPU nodes)
  include_tasks: gpu_modprobe.yaml
  when:
    - GPU_NODE | default(false) | bool
    - not (GPU_DRIVER_SKIP_INSTALL | default(false) | bool)
  tags: [gpu, prep_node]

- name: Prepare bloom fstab section markers
  include_tasks: fstab_markers.yaml
  when: >
    not (NO_DISKS_FOR_CLUSTER | default(false) | bool) and
    (
      (CLUSTER_DISKS | default([]) | length) > 0 or
      (CLUSTER_PREMOUNTED_DISKS | default('') | length) > 0 or
      (RANCHER_DISK | default('') | length) > 0
    )
  tags: [storage, prep_node]

- name: Setup custom rancher storage path
  include_tasks: rancher_storage.yaml
  when: RANCHER_DISK is defined and RANCHER_DISK != ""
  tags: [storage, rancher, prep_node]

- name: Prepare Longhorn Disks
  include_tasks: storage.yaml
  when: not (NO_DISKS_FOR_CLUSTER | default(false) | bool)
  tags: [storage, prep_node]

- name: Prepare Premounted Disks Fstab
  include_tasks: premounted_storage.yaml
  when: not (NO_DISKS_FOR_CLUSTER | default(false) | bool) and (CLUSTER_PREMOUNTED_DISKS | default('') | length) > 0
  tags: [storage, prep_node]

- name: System Configuration
  include_tasks: system_config.yaml
  tags: [system, firewall, gpu, prep_node]

- name: Disable NUMA Balancing
  include_tasks: disable_numa_balancing.yaml
  tags: [system, performance, prep_node]

- name: Configure NTP (Chrony)
  include_tasks: ntp.yaml
  tags: [ntp, prep_node]