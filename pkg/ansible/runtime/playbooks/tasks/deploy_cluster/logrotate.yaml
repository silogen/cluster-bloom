---
# Purpose: Configure log rotation for system and RKE2 logs
# Dependencies: None (system configuration)
# Usage: Imported by deploy_cluster/main.yaml
# Tags: [logging, deploy_cluster]

# Not /etc/logrotate.d: these configs name /var/log/syslog and /var/log/kern.log,
# which the distro's own rsyslog config already covers. logrotate refuses a
# duplicate log entry and aborts the whole run with "found error in file rsyslog,
# skipping", so the daily logrotate.service fails and nothing under
# /etc/logrotate.d gets rotated. They are driven by /etc/cron.d/logrotate-bloom
# with an explicit path, so a directory outside the include is enough.
- name: Create bloom logrotate directory
  file:
    path: /etc/logrotate-bloom.d
    state: directory
    mode: "0755"

- name: Create iSCSI aggressive logrotate config
  copy:
    content: |
      # /etc/logrotate-bloom.d/iscsi-aggressive.conf
      /var/log/kern.log
      /var/log/syslog
      {
          # /var/log is root:syslog 775, which logrotate refuses to rotate into
          # unless it is told whom to become. /etc/logrotate.conf carries the
          # same "su root adm", but the cron job runs logrotate against this
          # file alone and so never reads it: without this line every run ends
          # in "skipping ... because parent directory has insecure permissions"
          # and syslog is never rotated at all.
          su root adm
          size 200M
          rotate 10
          compress
          delaycompress
          missingok
          notifempty
          create 0640 syslog adm
          # No dateext. A size condition rotates more than once a day on a
          # busy node, and dateext names every archive after the day alone,
          # so the second rotation of a day collides with the first and is
          # skipped. The numbered suffix has no such limit and it is what
          # the distribution uses for every other log here.
          postrotate
              /usr/lib/rsyslog/rsyslog-rotate
          endscript
      }
    dest: /etc/logrotate-bloom.d/iscsi-aggressive.conf
    mode: "0644"

- name: Create RKE2 logrotate config
  copy:
    content: |
      /var/lib/rancher/rke2/agent/containerd/containerd.log
      {
          size 100M
          rotate 5
          compress
          delaycompress
          missingok
          notifempty
          # copytruncate, because containerd never reopens this file. rke2
          # starts containerd and redirects its stdout here; there is no
          # --log-file flag and no reopen signal. "create" renames
          # containerd.log and makes a new empty one, but containerd holds the
          # descriptor of the file it opened and goes on writing into the
          # renamed archive. The new containerd.log then stays at 0 bytes, so
          # it never passes "size 100M" and never rotates again, while the
          # archive grows with no config watching it.
          #
          # A fleet survey on 2026-09-11 found this on 20 of the 30 nodes that
          # run rke2, holding 365 MB, the oldest frozen since 2026-08-14. The
          # largest single archive was 52 MB and still being appended to.
          #
          # copytruncate copies the file and truncates the original in place,
          # so the descriptor stays valid. The cost is the lines written
          # between the copy and the truncate, and a second copy of the file
          # on disk while it runs. Neither matters for a runtime debug log; a
          # descriptor that never reopens does.
          #
          # The iSCSI config above does NOT need this: rsyslog reopens on the
          # HUP that /usr/lib/rsyslog/rsyslog-rotate sends in its postrotate.
          # Nothing equivalent exists for containerd, and restarting it to
          # reopen a log file would restart every container on the node.
          #
          # No "create" here. copytruncate keeps the original file and its
          # mode, so the two together make logrotate create a file it has just
          # truncated.
          copytruncate
          # No dateext, for the reason given on the iSCSI config above.
      }
    dest: /etc/logrotate-bloom.d/rke2.conf
    mode: "0644"

# The extensionless names are from the first version of this task, which was
# documented as "sudo cp ... /etc/logrotate.d/iscsi-aggressive". A later
# version switched to a .conf suffix without removing them, so int-test still
# carries both plus an .bak, and each one duplicates the same two log paths.
# One stale copy is enough to abort the whole logrotate run, so remove every
# name this task has ever written.
- name: Remove logrotate configs written by earlier bloom versions
  file:
    path: "/etc/logrotate.d/{{ item }}"
    state: absent
  loop:
    - iscsi-aggressive.conf
    - iscsi-aggressive
    - iscsi-aggressive.bak
    - rke2.conf
    - rke2

# Neither job runs on minute 0, and no two of them share a minute. Both use
# logrotate's default state file /var/lib/logrotate/status, and logrotate
# takes an exclusive lock on it: a second logrotate that starts while the
# first still holds the lock exits with "error: state file
# /var/lib/logrotate/status is already locked". Three runs used to meet on
# minute 0, the two below plus the distribution logrotate.service, which
# logrotate.timer starts at 00:00. The error is collected in
# /var/log/logrotate-bloom.log.
#
# No -f on either command. -f forces the rotation whatever the config says,
# so "size 200M" and "size 100M" below never applied: every run rotated, and
# with the dateext the configs used to carry, only the first run of a day
# could, the rest ending in "destination /var/log/syslog-<date> already
# exists, skipping rotation". Without -f logrotate rotates when the file
# passes the size, which is what the two configs were written for.
#
# Offsets rather than a state file for each job: the iSCSI config and the
# distribution rsyslog config both name /var/log/syslog and /var/log/kern.log,
# and the one shared state file is what stops the size rotation here and the
# weekly rotation there from rotating the same file twice.
- name: Create logrotate cron job
  copy:
    content: |
      # Managed by Ansible - cluster-bloom
      SHELL=/bin/sh
      PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

      # iSCSI logrotate - runs every 10 minutes, on minutes 1 to 51
      1,11,21,31,41,51 * * * * root /usr/sbin/logrotate /etc/logrotate-bloom.d/iscsi-aggressive.conf >> /var/log/logrotate-bloom.log 2>&1

      # logrotate for RKE2 logs - runs hourly, on minute 5
      5 * * * * root /usr/sbin/logrotate /etc/logrotate-bloom.d/rke2.conf >> /var/log/logrotate-bloom.log 2>&1
    dest: /etc/cron.d/logrotate-bloom
    mode: "0644"

- name: Configure rsyslog rate limiting
  block:
    # No module(load="imuxsock" ...) here: /etc/rsyslog.conf already loads
    # imuxsock, a second load is rejected with "module 'imuxsock' already in
    # this config", and the parameter was spelled SysSockRateLimit.Interval
    # rather than SysSock.RateLimit.Interval, so it never applied either.
    #
    # No dynaFile="default" on the action: omfile takes file or dynaFile, not
    # both, and no template named 'default' exists, so rsyslog disabled the
    # action and the rate limit never took effect.
    - name: Create rsyslog iSCSI filter
      copy:
        content: |
          # /etc/rsyslog.d/01-iscsi-filter.conf
          ruleset(name="iscsi_ratelimit") {
              if ($msg contains "detected conn error") or
              ($msg contains "session recovery timed out") or
              ($msg contains "longhorn") then {
                  action(type="omfile"
                      file="/var/log/syslog"
                      action.execOnlyEveryNthTime="500"
                      action.execOnlyEveryNthTimeTimeout="1200"
                  )
                  stop
              }
          }
        dest: /etc/rsyslog.d/01-iscsi-filter.conf
        mode: "0644"
      notify: Restart rsyslog
  tags: [logging, deploy_cluster]

- name: Ensure cron is running
  service:
    name: cron
    state: started
    enabled: yes
