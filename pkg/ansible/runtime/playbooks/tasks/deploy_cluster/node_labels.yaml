---
# Purpose: Generate and configure node labels for Kubernetes cluster
# Dependencies: NO_DISKS_FOR_CLUSTER, GPU_NODE, cluster_disks_list, cluster_block_disk_paths
# Usage: Imported by deploy_cluster/main.yaml
# Tags: [rke2, deploy_cluster]

- name: Build V1 filesystem disk labels list
  set_fact:
    disk_labels: "{{ (disk_labels | default([])) + ['bloom.disk___mnt___disk' + (((disk_index_offset | default(0) | int) + (item.0 | int)) | string) + '=disk' + (item.1 | replace('/', '___'))] }}"
  loop: "{{ range(cluster_disks_list | default([]) | length) | list | zip(cluster_disks_list | default([])) | list }}"
  when:
    - not (NO_DISKS_FOR_CLUSTER | default(false) | bool)
    - not (LONGHORN_V2_DATA_ENGINE | default(true) | bool)
    - cluster_disks_list is defined
    - cluster_disks_list | length > 0

- name: Build V2 block disk labels list
  set_fact:
    disk_labels: "{{ disk_labels | default([]) + ['bloom.disk' + (item | trim | regex_replace('^/', '') | regex_replace('/', '___')) + '=block'] }}"
  loop: "{{ cluster_block_disk_paths | default(cluster_disks_list | default([])) }}"
  when:
    - not (NO_DISKS_FOR_CLUSTER | default(false) | bool)
    - LONGHORN_V2_DATA_ENGINE | default(true) | bool
    - (cluster_block_disk_paths | default(cluster_disks_list | default([]))) | length > 0

- name: Parse premounted disks into list
  set_fact:
    cluster_premounted_list: "{{ CLUSTER_PREMOUNTED_DISKS.split(',') | map('trim') | reject('equalto', '') | list }}"
  when: not (NO_DISKS_FOR_CLUSTER | default(false) | bool) and CLUSTER_PREMOUNTED_DISKS != ""

- name: Build disk labels for premounted disks
  set_fact:
    disk_labels: "{{ disk_labels | default([]) + ['bloom.disk' + item | replace('/', '___') + '=premounted' + item | replace('/', '___')] }}"
  loop: "{{ cluster_premounted_list | default([]) }}"
  when: not (NO_DISKS_FOR_CLUSTER | default(false) | bool) and CLUSTER_PREMOUNTED_DISKS != "" and cluster_premounted_list is defined and cluster_premounted_list | length > 0

- name: Write node labels to config
  blockinfile:
    path: /etc/rancher/rke2/config.yaml
    block: |
      node-label:
      {% if not (NO_DISKS_FOR_CLUSTER | default(false) | bool) %}
        - node.longhorn.io/create-default-disk=config
        - node.longhorn.io/instance-manager=true
      {% endif %}
        - cluster-bloom/gpu-node={{ GPU_NODE | lower }}
        - cluster-bloom/first-node={{ FIRST_NODE | lower }}
      {% for label in disk_labels | default([]) %}
        - {{ label }}
      {% endfor %}
    marker: "# {mark} ANSIBLE MANAGED BLOCK - node labels"
