---
# Purpose: Pre-deployment data safety validation to prevent data loss
# Dependencies: NO_DISKS_FOR_CLUSTER, CLUSTER_DISKS, ansible_config_file variables
# Usage: Imported by main cluster-bloom.yaml as standalone safety check
# Tags: [validate_node, pre_deployment]

# Initialize validation issues list
- name: Initialize validation issues list
  set_fact:
    validation_issues: []

# RKE2 Installation Checks
- name: Check if RKE2 server service exists and is running
  systemd:
    name: rke2-server
  register: rke2_server_service
  failed_when: false
  changed_when: false

- name: Check if RKE2 agent service exists and is running
  systemd:
    name: rke2-agent
  register: rke2_agent_service
  failed_when: false
  changed_when: false

- name: Check if RKE2 data directory exists
  stat:
    path: /var/lib/rancher/rke2
  register: rke2_data_dir

- name: Check if RKE2 data directory is empty (if it exists)
  find:
    paths: /var/lib/rancher/rke2
    file_type: any
  register: rke2_data_contents
  when: rke2_data_dir.stat.exists

- name: Check if RKE2 config directory exists
  stat:
    path: /etc/rancher/rke2
  register: rke2_config_dir

- name: Check if RKE2 config directory is empty (if it exists)
  find:
    paths: /etc/rancher/rke2
    file_type: any
  register: rke2_config_contents
  when: rke2_config_dir.stat.exists

# Collect RKE2 issues without failing
- name: Collect RKE2 server service issue
  set_fact:
    validation_issues: "{{ validation_issues + ['RKE2 server service is running (' + rke2_server_service.status.ActiveState + ')'] }}"
  when: 
    - not (RKE2_PRESERVE_EXISTING | default(false) | bool)
    - rke2_server_service.status is defined
    - rke2_server_service.status.ActiveState == "active"

- name: Collect RKE2 agent service issue
  set_fact:
    validation_issues: "{{ validation_issues + ['RKE2 agent service is running (' + rke2_agent_service.status.ActiveState + ')'] }}"
  when:
    - not (RKE2_PRESERVE_EXISTING | default(false) | bool)
    - rke2_agent_service.status is defined
    - rke2_agent_service.status.ActiveState == "active"

- name: Collect RKE2 data directory issue
  set_fact:
    validation_issues: "{{ validation_issues + ['/var/lib/rancher/rke2 directory exists and contains ' + (rke2_data_contents.matched | string) + ' items'] }}"
  when:
    - not (RKE2_PRESERVE_EXISTING | default(false) | bool)
    - rke2_data_dir.stat.exists
    - (rke2_data_contents.matched | int) > 0

- name: Collect RKE2 config directory issue
  set_fact:
    validation_issues: "{{ validation_issues + ['/etc/rancher/rke2 directory exists and contains ' + (rke2_config_contents.matched | string) + ' items'] }}"
  when:
    - not (RKE2_PRESERVE_EXISTING | default(false) | bool)
    - rke2_config_dir.stat.exists
    - (rke2_config_contents.matched | int) > 0

- name: Report existing RKE2 state is being preserved
  debug:
    msg:
      - "↻ Existing RKE2 installation detected — preserving and reconciling it"
      - "  RKE2 services and /var/lib/rancher/rke2 state will not be removed"
      - "  Other data-safety checks (including disk checks) remain enforced"
  when:
    - RKE2_PRESERVE_EXISTING | default(false) | bool
    - >-
      (rke2_server_service.status.ActiveState | default('inactive')) == 'active' or
      (rke2_agent_service.status.ActiveState | default('inactive')) == 'active' or
      rke2_data_dir.stat.exists or
      rke2_config_dir.stat.exists

# k3s conflict checks — auto-remediated on loaned nodes (non-destructive pause)
- name: Check if k3s all-in-one service exists and is running
  systemd:
    name: k3s
  register: k3s_service
  failed_when: false
  changed_when: false

- name: Check if k3s-server service exists and is running
  systemd:
    name: k3s-server
  register: k3s_server_service
  failed_when: false
  changed_when: false

- name: Check if k3s-agent service exists and is running
  systemd:
    name: k3s-agent
  register: k3s_agent_service
  failed_when: false
  changed_when: false

- name: Detect k3s listeners on Kubernetes API port 6443
  shell: ss -H -ltnp 'sport = :6443' 2>/dev/null | grep -E 'k3s-server|"k3s"' || true
  register: k3s_port_listeners
  changed_when: false
  failed_when: false

- name: Detect orphaned k3s-server processes
  shell: pgrep -a -x k3s-server 2>/dev/null || true
  register: k3s_orphan_processes
  changed_when: false
  failed_when: false

- name: Initialize k3s validation issues list
  set_fact:
    k3s_validation_issues: []

- name: Collect k3s all-in-one service issue
  set_fact:
    k3s_validation_issues: "{{ k3s_validation_issues + ['k3s service is running (' + k3s_service.status.ActiveState + ')'] }}"
  when:
    - k3s_service.status is defined
    - k3s_service.status.ActiveState == "active"

- name: Collect k3s-server service issue
  set_fact:
    k3s_validation_issues: "{{ k3s_validation_issues + ['k3s-server service is running (' + k3s_server_service.status.ActiveState + ')'] }}"
  when:
    - k3s_server_service.status is defined
    - k3s_server_service.status.ActiveState == "active"

- name: Collect k3s-agent service issue
  set_fact:
    k3s_validation_issues: "{{ k3s_validation_issues + ['k3s-agent service is running (' + k3s_agent_service.status.ActiveState + ')'] }}"
  when:
    - k3s_agent_service.status is defined
    - k3s_agent_service.status.ActiveState == "active"

- name: Collect k3s port 6443 listener issue
  set_fact:
    k3s_validation_issues: "{{ k3s_validation_issues + ['Port 6443 held by k3s: ' + item] }}"
  loop: "{{ k3s_port_listeners.stdout_lines | default([]) | select('match', '.+') | list }}"
  when:
    - k3s_port_listeners.stdout_lines | default([]) | length > 0
    - rke2_server_service.status.ActiveState | default('inactive') != 'active'

- name: Collect orphaned k3s-server process issue
  set_fact:
    k3s_validation_issues: "{{ k3s_validation_issues + ['Orphaned k3s-server process: ' + item] }}"
  loop: "{{ k3s_orphan_processes.stdout_lines | default([]) | select('match', '.+') | list }}"
  when: k3s_orphan_processes.stdout_lines | default([]) | length > 0

- name: Mark k3s pause required when conflicts detected
  set_fact:
    k3s_pause_required: true
  when: k3s_validation_issues | length > 0

- name: Announce automatic k3s pause for loaned nodes
  debug:
    msg:
      - "⏸️  Conflicting k3s installation detected — pausing automatically (non-destructive)"
      - "   k3s data under /var/lib/rancher/k3s is preserved; systemd enabled state unchanged"
      - "   Detected conflicts:"
      - "{% for issue in k3s_validation_issues %}   • {{ issue }}{% endfor %}"
  when: k3s_pause_required | default(false) | bool

- name: Fail if k3s conflicts found and automatic pause is disabled
  fail:
    msg: |
      ❌ Pre-deployment Validation Failed: Conflicting k3s Installation

      The following k3s conflicts were detected:
      {% for issue in k3s_validation_issues %}
      • {{ issue }}
      {% endfor %}

      Automatic k3s pause was skipped because SKIP_K3S_PAUSE is set.
      Remove SKIP_K3S_PAUSE or unset it to allow bloom to stop k3s non-destructively.
  when:
    - k3s_validation_issues | length > 0
    - SKIP_K3S_PAUSE | default(false) | bool

# CLUSTER_DISKS Mount Checks (conditional)
- name: Convert CLUSTER_DISKS from comma-separated string to list for validation
  set_fact:
    cluster_disks_validation_list: "{{ CLUSTER_DISKS.split(',') if CLUSTER_DISKS is string and CLUSTER_DISKS | trim != '' else (CLUSTER_DISKS if CLUSTER_DISKS is not string and CLUSTER_DISKS is iterable else []) }}"
  when: not (NO_DISKS_FOR_CLUSTER | default(false) | bool) and (CLUSTER_DISKS | default([]) | length) > 0

- name: Check mount status for each disk in CLUSTER_DISKS
  shell: "mount | grep -q '^{{ item }}' && echo 'mounted' || echo 'unmounted'"
  register: disk_mount_status
  loop: "{{ cluster_disks_validation_list | default([]) }}"
  when: not (NO_DISKS_FOR_CLUSTER | default(false) | bool) and cluster_disks_validation_list | length > 0
  changed_when: false
  failed_when: false

- name: Collect information about mounted disks
  set_fact:
    mounted_cluster_disks: "{{ mounted_cluster_disks | default([]) + [item.item] }}"
  loop: "{{ disk_mount_status.results | default([]) }}"
  when: not (NO_DISKS_FOR_CLUSTER | default(false) | bool) and item.stdout is defined and item.stdout == 'mounted'

- name: Collect CLUSTER_DISKS mount issue
  set_fact:
    validation_issues: "{{ validation_issues + ['CLUSTER_DISKS are mounted: ' + (mounted_cluster_disks | join(', '))] }}"
  when: not (NO_DISKS_FOR_CLUSTER | default(false) | bool) and mounted_cluster_disks is defined and mounted_cluster_disks | length > 0

# CLUSTER_PREMOUNTED_DISKS checks — these MUST already be mounted
- name: Parse premounted disks for pre-deployment validation
  set_fact:
    premounted_validation_list: "{{ CLUSTER_PREMOUNTED_DISKS.split(',') | map('trim') | reject('equalto', '') | list }}"
  when: not (NO_DISKS_FOR_CLUSTER | default(false) | bool) and CLUSTER_PREMOUNTED_DISKS != ""

- name: Check mount status for each disk in CLUSTER_PREMOUNTED_DISKS
  shell: "mountpoint -q {{ item }} && echo 'mounted' || echo 'unmounted'"
  register: premounted_mount_status
  loop: "{{ premounted_validation_list | default([]) }}"
  when: not (NO_DISKS_FOR_CLUSTER | default(false) | bool) and CLUSTER_PREMOUNTED_DISKS != "" and premounted_validation_list | length > 0
  changed_when: false
  failed_when: false

- name: Collect unmounted premounted disks
  set_fact:
    unmounted_premounted_disks: "{{ unmounted_premounted_disks | default([]) + [item.item] }}"
  loop: "{{ premounted_mount_status.results | default([]) }}"
  when: not (NO_DISKS_FOR_CLUSTER | default(false) | bool) and CLUSTER_PREMOUNTED_DISKS != "" and item.stdout is defined and item.stdout == 'unmounted'

# Report destroy-data-fixable issues (RKE2 running, CLUSTER_DISKS already mounted)
- name: Fail deployment if any data safety issues found
  fail:
    msg: |
      ❌ Pre-deployment Data Safety Validation Failed
      
      The following issues were detected:
      {% for issue in validation_issues %}
      • {{ issue }}
      {% endfor %}
      
      These issues prevent safe deployment and could lead to data loss.
      
      Resolution options:

      1. Resume the same RKE2 installation (recommended after a partial Bloom run):
         Direct execution:
           sudo ./bloom cli {{ validate_config_file | default('bloom.yaml') }} --preserve-existing-rke2
         Exported playbook:
           ./bloom cli {{ validate_config_file | default('bloom.yaml') }} --export --preserve-existing-rke2

         This preserves RKE2 state only. Disk and other data-safety checks remain active.

      2. Remove only the existing RKE2 installation, then rerun Bloom:
           sudo systemctl stop rke2-server rke2-agent
           sudo /usr/local/bin/rke2-uninstall.sh

         Do not manually rm -rf a running RKE2 data directory.

      3. Fully destroy the cluster and Bloom-managed disk data:
           sudo ./bloom cli {{ validate_config_file | default('bloom.yaml') }} --destroy-data

         WARNING: --destroy-data destroys RKE2, Longhorn, and configured cluster disk data.
  when: validation_issues | length > 0

# Report premounted-disk issues separately — resolution is remount, not destroy
- name: Fail if CLUSTER_PREMOUNTED_DISKS are not mounted
  fail:
    msg: |
      ❌ Pre-deployment Validation Failed: Premounted Disks Not Mounted

      The following CLUSTER_PREMOUNTED_DISKS are not currently mounted:
      {% for disk in unmounted_premounted_disks %}
      • {{ disk }}
      {% endfor %}

      These disks must be mounted before bloom can run.
      bloom does NOT format or wipe premounted disks — they must be
      pre-mounted by the operator before deployment.

      To remount from an existing fstab entry:
      {% for disk in unmounted_premounted_disks %}
        sudo mount {{ disk }}
      {% endfor %}

      Or if no fstab entry exists yet, mount by device and re-run bloom:
        sudo mount /dev/<device> {{ unmounted_premounted_disks | first }}
        # (repeat for each disk, then re-run bloom)

      Verify mounts with:  lsblk -o NAME,SIZE,MOUNTPOINT
  when: >
    not (NO_DISKS_FOR_CLUSTER | default(false) | bool) and
    CLUSTER_PREMOUNTED_DISKS != "" and
    unmounted_premounted_disks is defined and
    unmounted_premounted_disks | length > 0

# Success message
- name: Pre-deployment data safety validation completed
  debug:
    msg: "✓ Pre-deployment data safety validation completed successfully"