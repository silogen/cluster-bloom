---
# Purpose: Setup MetalLB load balancer for external service access
# Dependencies: FIRST_NODE variable
# Usage: Imported by deploy_k8s_apps/main.yaml (conditional on FIRST_NODE)
# Tags: [metallb, deploy_k8s_apps]

# prepare_rke2 already resolved this address and pinned kc.<DOMAIN> to it, so the
# apiserver reaches the OIDC issuer on providers that will not hairpin their own
# ingress address. Consume that fact rather than resolving it a second time: if
# the two ever disagreed, the pin would point somewhere envoy does not answer.
# The fallback keeps this task standalone when it is run on its own via --tags.
- name: Get default IP for MetalLB
  shell: ip route get 1 | awk '{print $7; exit}'
  register: metallb_ip_cmd
  changed_when: false
  when: cluster_ingress_ip is not defined

- name: Resolve the MetalLB pool address
  set_fact:
    metallb_ip: "{{ cluster_ingress_ip | default(metallb_ip_cmd.stdout | trim) }}"

- name: Create MetalLB address pool config
  copy:
    content: |
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: cluster-bloom-ip-pool
        namespace: metallb-system
      spec:
        addresses:
        - {{ metallb_ip }}/32
      ---
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: cluster-bloom-l2-advertisement
        namespace: metallb-system
    dest: /var/lib/rancher/rke2/server/manifests/metallb-address.yaml
    mode: "0644"